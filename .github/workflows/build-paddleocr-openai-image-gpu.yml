name: Build PaddleOCR OpenAI GPU Image

on:
  push:
    branches:
      - main
      - release/*
    paths:
      - 'deploy/docker/openai_api/**'
      - '.github/workflows/build-paddleocr-openai-image-gpu.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PaddleOCR OpenAI GPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/openai_api/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/paddleocr-openai:gpu-latest
            ghcr.io/${{ github.repository_owner }}/paddleocr-openai:gpu-${{ github.sha }}
